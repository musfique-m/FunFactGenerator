<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Generate icons</title>
    <style>
      body { font-family: -apple-system, sans-serif; padding: 20px; }
      canvas { border: 1px dashed #ccc; margin: 8px; vertical-align: middle; background: #f8f8f8; }
      button { font-size: 14px; padding: 8px 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h2>Fun Fact Generator — icon builder</h2>
    <p>Open this file in Chrome. Previews render automatically; click the button to download <code>icon16.png</code>, <code>icon48.png</code>, and <code>icon128.png</code>. Move them into the <code>icons/</code> folder next to <code>manifest.json</code>.</p>
    <div id="previews"></div>
    <button id="download">Download all PNGs</button>

    <script>
      const EMOJI = "🎲";
      const SIZES = [16, 48, 128];
      const previews = document.getElementById("previews");

      function render(size) {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, size, size);
        // Use Apple Color Emoji if present, then generic emoji fallbacks.
        ctx.font = `${Math.floor(size * 0.9)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        // Nudge down slightly so the die is optically centred.
        ctx.fillText(EMOJI, size / 2, size / 2 + size * 0.02);
        return canvas;
      }

      const canvases = SIZES.map((size) => {
        const c = render(size);
        const label = document.createElement("span");
        label.textContent = `${size}×${size} `;
        previews.appendChild(label);
        previews.appendChild(c);
        return { size, canvas: c };
      });

      function download(canvas, filename) {
        canvas.toBlob((blob) => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }, "image/png");
      }

      document.getElementById("download").addEventListener("click", () => {
        canvases.forEach(({ size, canvas }) => download(canvas, `icon${size}.png`));
      });
    </script>
  </body>
</html>
